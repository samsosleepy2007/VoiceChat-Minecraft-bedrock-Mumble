name: Verify Mumble Android Source Patch

on:
  push:
    branches: [ main, develop, 'feature/**', 'vc-mumble-server/**' ]
    paths:
      - 'native/mumble_android/**'
      - 'scripts/fetch-mumble.sh'
      - 'scripts/prepare-mumble-source.py'
      - 'tests/test_prepare_mumble_source.py'
      - '.github/workflows/mumble-source-verify.yml'
  pull_request:
    paths:
      - 'native/mumble_android/**'
      - 'scripts/fetch-mumble.sh'
      - 'scripts/prepare-mumble-source.py'
      - 'tests/test_prepare_mumble_source.py'
      - '.github/workflows/mumble-source-verify.yml'
  workflow_dispatch:

jobs:
  prepare-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify patcher fixture
        run: python3 tests/test_prepare_mumble_source.py
      - name: Standalone bridge contract static test
        run: python3 tests/test_vc_mumble_bridge_contract.py
      - name: Download, verify and patch Mumble 1.6.870
        run: ./scripts/fetch-mumble.sh
      - name: Verify prepared symbols
        run: |
          grep -F 'qt_add_executable(mumble-server MANUAL_FINALIZATION' .build/mumble-1.6.870/src/murmur/CMakeLists.txt
          grep -F 'VC_MUMBLE_EMBEDDED_RETURN' .build/mumble-1.6.870/src/murmur/main.cpp
          grep -F 'VC_ANDROID_DEFAULT_INI' .build/mumble-1.6.870/src/murmur/main.cpp
          grep -F 'VCProximity::shouldRoute' .build/mumble-1.6.870/src/murmur/Server.cpp
          grep -F 'OUTPUT_NAME "vcserver"' .build/mumble-1.6.870/src/murmur/CMakeLists.txt
          grep -F 'VC_PROXIMITY_REGULAR_CHANNEL' .build/mumble-1.6.870/src/murmur/Server.cpp
          grep -F 'VC_PROXIMITY_LINKED_CHANNEL' .build/mumble-1.6.870/src/murmur/Server.cpp
      - name: Package prepared source for the Android core build job
        run: tar -C .build -czf mumble-1.6.870-vc-android-prepared.tar.gz mumble-1.6.870
      - uses: actions/upload-artifact@v7
        with:
          name: mumble-1.6.870-vc-android-prepared
          path: mumble-1.6.870-vc-android-prepared.tar.gz
          retention-days: 7
