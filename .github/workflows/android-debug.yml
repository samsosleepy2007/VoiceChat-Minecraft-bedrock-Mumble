name: Android Test APK

on:
  push:
    branches:
      - 'test/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Project contract checks
        shell: bash
        run: bash ./scripts/check-project.sh

      - name: Build debug smoke APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and write SHA-256
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: vc-mumble-test-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
