name: Android Embedded Mumble Core (experimental)

on:
  workflow_dispatch:
  push:
    branches: ['test/vc-mumble-github-import', 'main', 'feature/portwarp-embedded-probe', 'feature/cyberpunk-ui-v1', 'feature/modern-ui-v2', 'fix/android-start-after-bridge-edit', 'feature/minecraft-mic-addon-v1', 'feature/proximity-volume-attenuation-v1', 'feature/vcb-ui-attenuation-level-v1', 'feature/mumla-volume-client-v1', 'fix/mic-state-sync-v1']

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'
  VCPKG_TAG: '2026.07.29'
  NDK_VERSION: '28.2.13676358'
  RELEASE_TAG: 'v0.6.0-beta.9'
  RELEASE_APK: 'VC-Mumble-Server-v0.6.0-beta.9-arm64-v8a.apk'
  RELEASE_PLUGIN: 'endstone_vc_mumble-0.4.1-py3-none-any.whl'
  RELEASE_ADDON: 'VC_Mumble_ItemMic_v2.7.6.mcaddon'
  RELEASE_MUMLA: 'VC-Mumla-v0.5-aec-debug.apk'
  MUMLA_NDK_VERSION: '25.1.8937393'
  RELEASE_CHECKSUMS: 'SHA256SUMS.txt'

jobs:
  build-core-apk:
    # Explicit checkpoints only; ordinary commits keep running the smoke build.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[core-build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Shell syntax preflight
        run: |
          sh -n ./scripts/check-project.sh
          bash -n ./scripts/build-mumble-android-core.sh

      - name: Project contract checks
        run: bash ./scripts/check-project.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK / NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf automake libtool pkg-config patchelf
          python3 -m pip install --upgrade pip
          python3 -m pip install 'aqtinstall==3.3.0'

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt/${{ env.QT_VERSION }}
          key: vc-mumble-qt-${{ runner.os }}-${{ env.QT_VERSION }}-android-arm64-v1

      - name: Install Qt Android + matching host tools
        run: |
          if [[ ! -d "$HOME/Qt/${QT_VERSION}/android_arm64_v8a" || ! -d "$HOME/Qt/${QT_VERSION}/gcc_64" ]]; then
            python3 -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a --autodesktop -O "$HOME/Qt"
          else
            echo "Qt ${QT_VERSION} restored from cache"
          fi
          echo "QT_ANDROID_PREFIX=$HOME/Qt/${QT_VERSION}/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/${QT_VERSION}/gcc_64" >> "$GITHUB_ENV"

      - name: Verify Qt Android CMake toolchain
        run: |
          test -x "$QT_ANDROID_PREFIX/bin/qt-cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt6Core/Qt6CoreConfig.cmake"
          "$QT_ANDROID_PREFIX/bin/qt-cmake" --version
          echo "Qt Android CMake preflight OK: $QT_ANDROID_PREFIX"

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$HOME/.cache/vcpkg/archives"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vc-mumble-vcpkg-${{ runner.os }}-${{ env.VCPKG_TAG }}-${{ env.NDK_VERSION }}-arm64-v1
          restore-keys: |
            vc-mumble-vcpkg-${{ runner.os }}-${{ env.VCPKG_TAG }}-${{ env.NDK_VERSION }}-arm64-

      - name: Build Android + host dependencies with pinned vcpkg
        run: |
          git clone --depth 1 --branch "${VCPKG_TAG}" https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          export VCPKG_DISABLE_METRICS=1
          export VCPKG_DEFAULT_BINARY_CACHE="$HOME/.cache/vcpkg/archives"
          "$HOME/vcpkg/vcpkg" install \
            openssl:arm64-android \
            protobuf:arm64-android \
            sqlite3:arm64-android \
            boost-algorithm:arm64-android \
            protobuf:x64-linux \
            --clean-after-build
          "$HOME/vcpkg/vcpkg" install \
            openssl:arm64-android-dynamic \
            --overlay-triplets="$GITHUB_WORKSPACE/cmake/triplets" \
            --clean-after-build
          echo "VC_ANDROID_DEP_PREFIX=$HOME/vcpkg/installed/arm64-android" >> "$GITHUB_ENV"
          echo "VC_ANDROID_TLS_PREFIX=$HOME/vcpkg/installed/arm64-android-dynamic" >> "$GITHUB_ENV"
          echo "PROTOC=$HOME/vcpkg/installed/x64-linux/tools/protobuf/protoc" >> "$GITHUB_ENV"

      - name: Build and stage embedded Mumble core
        run: ./scripts/build-mumble-android-core.sh

      - name: Build core APK
        run: gradle -PvcMumbleCore=true :app:assembleDebug --stacktrace

      - name: Inventory Qt runtime AAR and packaged APK
        run: |
          test -f .build/android-stage/vc-mumble-runtime.aar
          cat .build/android-stage/vc-mumble-runtime.contents.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/|classes' || true
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'libpwrp'; then
            echo "ERROR: embedded PortWarp runtime must not be packaged" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vc-mumble-server-core-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            .build/android-stage/vc-mumble-runtime.aar
            .build/android-stage/vc-mumble-runtime.contents.txt
            .build/android-stage/extra-libs/arm64-v8a/
          retention-days: 14

      - name: Set up Java 21 for VC Mumla release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build VC Mumla release asset
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        run: |
          sdkmanager "ndk;${MUMLA_NDK_VERSION}"
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${MUMLA_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          rm -rf .build/mumla-release
          git clone https://github.com/quite/mumla.git .build/mumla-release
          git -C .build/mumla-release checkout 477b337ebcee1655c1357d51db99cf92bbc175a4

          rm -rf .build/mumla-release/libraries/humla
          git clone https://github.com/quite/humla.git .build/mumla-release/libraries/humla
          git -C .build/mumla-release/libraries/humla checkout 7966f3828d6ed87ef29c517abfade6ad7998cdc5
          git -C .build/mumla-release/libraries/humla submodule update --init --recursive

          python3 scripts/patch-mumla-vc-client.py --root .build/mumla-release
          (
            cd .build/mumla-release/libraries/humla/libs/humla-spongycastle
            chmod +x ../../gradlew
            ../../gradlew jar --no-daemon
          )
          (
            cd .build/mumla-release
            chmod +x gradlew
            ./gradlew :app:assembleBetaDebug --stacktrace --no-daemon
          )

          MUMLA_APK="$(find .build/mumla-release/app/build/outputs/apk -type f -name '*beta*debug*.apk' -print -quit)"
          test -n "${MUMLA_APK}" && test -f "${MUMLA_APK}"
          cp "${MUMLA_APK}" "${RELEASE_MUMLA}"
          unzip -t "${RELEASE_MUMLA}" >/dev/null

      - name: Prepare GitHub release assets
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${RELEASE_APK}"

          python3 -m pip install 'build>=1,<2'
          rm -rf endstone-plugin/dist endstone-plugin/build endstone-plugin/*.egg-info
          python3 -m build --wheel endstone-plugin
          test -f "endstone-plugin/dist/${RELEASE_PLUGIN}"
          cp "endstone-plugin/dist/${RELEASE_PLUGIN}" "${RELEASE_PLUGIN}"

          rm -f VC_Mumble_ItemMic_BP_v2.7.6.mcpack VC_Mumble_ItemMic_RP_v2.7.6.mcpack "${RELEASE_ADDON}"
          python3 scripts/build-mic-addon-release.py --output .
          test -f "${RELEASE_ADDON}"
          unzip -t "${RELEASE_ADDON}" >/dev/null

          sha256sum "${RELEASE_APK}" "${RELEASE_MUMLA}" "${RELEASE_PLUGIN}" "${RELEASE_ADDON}" > "${RELEASE_CHECKSUMS}"
          cat "${RELEASE_CHECKSUMS}"

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; replacing assets"
            gh release upload "${RELEASE_TAG}" "${RELEASE_APK}" "${RELEASE_MUMLA}" "${RELEASE_PLUGIN}" "${RELEASE_ADDON}" "${RELEASE_CHECKSUMS}" --clobber
          else
            gh release create "${RELEASE_TAG}"               "${RELEASE_APK}"               "${RELEASE_MUMLA}"               "${RELEASE_PLUGIN}"               "${RELEASE_ADDON}"               "${RELEASE_CHECKSUMS}"               --target "${GITHUB_SHA}"               --title "VC Mumble Server ${RELEASE_TAG}"               --notes-file RELEASE_NOTES.md               --prerelease
          fi
