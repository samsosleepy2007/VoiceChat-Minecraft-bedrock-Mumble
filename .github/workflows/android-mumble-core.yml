name: Android Embedded Mumble Core (experimental)

on:
  workflow_dispatch:
  push:
    branches: ['test/vc-mumble-github-import', 'main', 'feature/portwarp-embedded-probe', 'feature/cyberpunk-ui-v1', 'feature/modern-ui-v2', 'fix/android-start-after-bridge-edit', 'feature/minecraft-mic-addon-v1', 'feature/proximity-volume-attenuation-v1', 'feature/vcb-ui-attenuation-level-v1']

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'
  VCPKG_TAG: '2026.07.29'
  NDK_VERSION: '28.2.13676358'
  RELEASE_TAG: 'v0.6.0-beta.6'
  RELEASE_APK: 'VC-Mumble-Server-v0.6.0-beta.6-arm64-v8a.apk'
  RELEASE_PLUGIN: 'endstone_vc_mumble-0.3.0-py3-none-any.whl'
  RELEASE_ADDON: 'VC_Mumble_ItemMic_v2.7.4.mcaddon'
  RELEASE_CHECKSUMS: 'SHA256SUMS.txt'

jobs:
  build-core-apk:
    # Explicit checkpoints only; ordinary commits keep running the smoke build.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[core-build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Shell syntax preflight
        run: |
          sh -n ./scripts/check-project.sh
          bash -n ./scripts/build-mumble-android-core.sh

      - name: Project contract checks
        run: bash ./scripts/check-project.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK / NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf automake libtool pkg-config patchelf
          python3 -m pip install --upgrade pip
          python3 -m pip install 'aqtinstall==3.3.0'

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt/${{ env.QT_VERSION }}
          key: vc-mumble-qt-${{ runner.os }}-${{ env.QT_VERSION }}-android-arm64-v1

      - name: Install Qt Android + matching host tools
        run: |
          if [[ ! -d "$HOME/Qt/${QT_VERSION}/android_arm64_v8a" || ! -d "$HOME/Qt/${QT_VERSION}/gcc_64" ]]; then
            python3 -m aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a --autodesktop -O "$HOME/Qt"
          else
            echo "Qt ${QT_VERSION} restored from cache"
          fi
          echo "QT_ANDROID_PREFIX=$HOME/Qt/${QT_VERSION}/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$HOME/Qt/${QT_VERSION}/gcc_64" >> "$GITHUB_ENV"

      - name: Verify Qt Android CMake toolchain
        run: |
          test -x "$QT_ANDROID_PREFIX/bin/qt-cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_ANDROID_PREFIX/lib/cmake/Qt6Core/Qt6CoreConfig.cmake"
          "$QT_ANDROID_PREFIX/bin/qt-cmake" --version
          echo "Qt Android CMake preflight OK: $QT_ANDROID_PREFIX"

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$HOME/.cache/vcpkg/archives"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vc-mumble-vcpkg-${{ runner.os }}-${{ env.VCPKG_TAG }}-${{ env.NDK_VERSION }}-arm64-v1
          restore-keys: |
            vc-mumble-vcpkg-${{ runner.os }}-${{ env.VCPKG_TAG }}-${{ env.NDK_VERSION }}-arm64-

      - name: Build Android + host dependencies with pinned vcpkg
        run: |
          git clone --depth 1 --branch "${VCPKG_TAG}" https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          export VCPKG_DISABLE_METRICS=1
          export VCPKG_DEFAULT_BINARY_CACHE="$HOME/.cache/vcpkg/archives"
          "$HOME/vcpkg/vcpkg" install \
            openssl:arm64-android \
            protobuf:arm64-android \
            sqlite3:arm64-android \
            boost-algorithm:arm64-android \
            protobuf:x64-linux \
            --clean-after-build
          "$HOME/vcpkg/vcpkg" install \
            openssl:arm64-android-dynamic \
            --overlay-triplets="$GITHUB_WORKSPACE/cmake/triplets" \
            --clean-after-build
          echo "VC_ANDROID_DEP_PREFIX=$HOME/vcpkg/installed/arm64-android" >> "$GITHUB_ENV"
          echo "VC_ANDROID_TLS_PREFIX=$HOME/vcpkg/installed/arm64-android-dynamic" >> "$GITHUB_ENV"
          echo "PROTOC=$HOME/vcpkg/installed/x64-linux/tools/protobuf/protoc" >> "$GITHUB_ENV"

      - name: Build and stage embedded Mumble core
        run: ./scripts/build-mumble-android-core.sh

      - name: Build core APK
        run: gradle -PvcMumbleCore=true :app:assembleDebug --stacktrace

      - name: Inventory Qt runtime AAR and packaged APK
        run: |
          test -f .build/android-stage/vc-mumble-runtime.aar
          cat .build/android-stage/vc-mumble-runtime.contents.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/|classes' || true
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'libpwrp'; then
            echo "ERROR: embedded PortWarp runtime must not be packaged" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vc-mumble-server-core-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            .build/android-stage/vc-mumble-runtime.aar
            .build/android-stage/vc-mumble-runtime.contents.txt
            .build/android-stage/extra-libs/arm64-v8a/
          retention-days: 14

      - name: Prepare GitHub release assets
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${RELEASE_APK}"
          python3 -m pip install 'build>=1,<2'
          rm -rf endstone-plugin/dist endstone-plugin/build endstone-plugin/*.egg-info
          python3 -m build --wheel endstone-plugin
          test -f "endstone-plugin/dist/${RELEASE_PLUGIN}"
          cp "endstone-plugin/dist/${RELEASE_PLUGIN}" "${RELEASE_PLUGIN}"

          rm -rf .build/minecraft-addon-release
          mkdir -p .build/minecraft-addon-release/src .build/minecraft-addon-release/outer
          echo "eb2e115c2d5314c36a8a8718ce1b4f9bde3a737f04ab633ff01a09d1e6bb3993  minecraft-addon/v2.7.4/source.tgz.b64.part0" | sha256sum -c -
          echo "80f400eb9f0fef141084df7aabe387534e6556131dd8410f5485c49ceb4edad4  minecraft-addon/v2.7.4/source.tgz.b64.part1" | sha256sum -c -
          echo "c5f8e6165a2649e6a021fe81146c7aec3a532fa14936dd5f2079325f940ad21b  minecraft-addon/v2.7.4/source.tgz.b64.part2.0" | sha256sum -c -
          echo "99be147b9cacb529d7a10d3d133765faedc4fcfb7ea2a2f847f7107fca1156e6  minecraft-addon/v2.7.4/source.tgz.b64.part2.1" | sha256sum -c -
          echo "198daeaf814c86079aab2c8e4238aef32e7c3c833ff58467acdc78482242ee84  minecraft-addon/v2.7.4/source.tgz.b64.part2.2" | sha256sum -c -
          echo "563eb51d684a5387fb05b7fa944150a26b559e190fe583291c91551110303c4a  minecraft-addon/v2.7.4/source.tgz.b64.part2.3" | sha256sum -c -
          echo "5ed76d14f7abb7c7ef6c9c071a7f11838d561f78b8362c3094fefd388c3ca512  minecraft-addon/v2.7.4/source.tgz.b64.part2.4" | sha256sum -c -
          echo "11bba00c2d3ee881773c902c08086d17fb5b0fe5499071dfb926ef8ee48672c8  minecraft-addon/v2.7.4/source.tgz.b64.part2.5" | sha256sum -c -
          echo "f68e9eca3e2d683ff9a37068a7983dfb2b8fb5eec7f2d0e85d0cc714c974dc78  minecraft-addon/v2.7.4/source.tgz.b64.part2.6" | sha256sum -c -
          echo "ae1d28c0b545ced2e28ff545d4c00a03b34f91fb1dde29f07a5cc3389a1b1f33  minecraft-addon/v2.7.4/source.tgz.b64.part3" | sha256sum -c -
          cat \
            minecraft-addon/v2.7.4/source.tgz.b64.part0 \
            minecraft-addon/v2.7.4/source.tgz.b64.part1 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.0 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.1 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.2 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.3 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.4 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.5 \
            minecraft-addon/v2.7.4/source.tgz.b64.part2.6 \
            minecraft-addon/v2.7.4/source.tgz.b64.part3 \
            | base64 -d > .build/minecraft-addon-release/source.tgz
          echo "f66a7633d4d923e49efd5236f382747e21205e9448454dda9ffa5f074cc33c8f  .build/minecraft-addon-release/source.tgz" | sha256sum -c -
          tar -xzf .build/minecraft-addon-release/source.tgz -C .build/minecraft-addon-release/src
          cp .build/minecraft-addon-release/src/rp/textures/items/icon_mic_on.png .build/minecraft-addon-release/src/rp/pack_icon.png
          cp .build/minecraft-addon-release/src/rp/textures/items/icon_mic_on.png .build/minecraft-addon-release/src/bp/pack_icon.png
          (cd .build/minecraft-addon-release/src/bp && zip -qr "$GITHUB_WORKSPACE/VC_Mumble_ItemMic_BP_v2.7.4.mcpack" .)
          (cd .build/minecraft-addon-release/src/rp && zip -qr "$GITHUB_WORKSPACE/VC_Mumble_ItemMic_RP_v2.7.4.mcpack" .)
          cp VC_Mumble_ItemMic_BP_v2.7.4.mcpack VC_Mumble_ItemMic_RP_v2.7.4.mcpack .build/minecraft-addon-release/outer/
          (cd .build/minecraft-addon-release/outer && zip -qr "$GITHUB_WORKSPACE/${RELEASE_ADDON}" VC_Mumble_ItemMic_BP_v2.7.4.mcpack VC_Mumble_ItemMic_RP_v2.7.4.mcpack)
          unzip -t "${RELEASE_ADDON}" >/dev/null

          sha256sum "${RELEASE_APK}" "${RELEASE_PLUGIN}" "${RELEASE_ADDON}" > "${RELEASE_CHECKSUMS}"
          cat "${RELEASE_CHECKSUMS}"

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; replacing assets"
            gh release upload "${RELEASE_TAG}" "${RELEASE_APK}" "${RELEASE_PLUGIN}" "${RELEASE_ADDON}" "${RELEASE_CHECKSUMS}" --clobber
          else
            gh release create "${RELEASE_TAG}"               "${RELEASE_APK}"               "${RELEASE_PLUGIN}"               "${RELEASE_ADDON}"               "${RELEASE_CHECKSUMS}"               --target "${GITHUB_SHA}"               --title "VC Mumble Server ${RELEASE_TAG}"               --notes-file RELEASE_NOTES.md               --prerelease
          fi
