name: PortWarp Android Compatibility Probe

on:
  push:
    branches: ['feature/portwarp-embedded-probe']
    paths:
      - '.github/workflows/portwarp-android-compat-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-portwarp-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file curl tar

      - name: Discover and download official Linux ARM64 CLI
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL https://portwarp.com/downloads)"
          version="$(printf '%s' "$html" | grep -oE 'pwrp-[0-9]+\.[0-9]+\.[0-9]+-linux-arm64\.tar\.gz' | head -1 | sed -E 's/^pwrp-([0-9.]+)-linux-arm64\.tar\.gz$/\1/' || true)"
          if [[ -z "$version" ]]; then
            version="0.3.6"
          fi
          url="https://portwarp.com/download/pwrp-${version}-linux-arm64.tar.gz"
          echo "PORTWARP_VERSION=$version" >> "$GITHUB_ENV"
          echo "PORTWARP_URL=$url" >> "$GITHUB_ENV"
          echo "Downloading $url"
          curl -fL --retry 3 "$url" -o portwarp-linux-arm64.tar.gz
          tar -tzf portwarp-linux-arm64.tar.gz | tee archive-contents.txt
          mkdir extracted
          tar -xzf portwarp-linux-arm64.tar.gz -C extracted

      - name: Inspect archive notices
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LICENSE / NOTICE candidates ===" | tee notices.txt
          find extracted -maxdepth 3 -type f \( -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname 'COPYING*' -o -iname 'README*' \) -print | tee -a notices.txt
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue
            echo "===== $f =====" >> notices.txt
            sed -n '1,220p' "$f" >> notices.txt || true
          done < <(find extracted -maxdepth 3 -type f \( -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname 'COPYING*' -o -iname 'README*' \) -print)
          cat notices.txt

      - name: Inspect PortWarp executable ELF compatibility
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find extracted -type f -name 'pwrp' -print -quit)"
          if [[ -z "$bin" ]]; then
            echo "ERROR: pwrp executable not found" >&2
            exit 1
          fi
          chmod +x "$bin"
          {
            echo "PORTWARP_VERSION=${PORTWARP_VERSION}"
            echo "BINARY=$bin"
            echo
            echo "=== file ==="
            file "$bin"
            echo
            echo "=== ELF header ==="
            readelf -h "$bin"
            echo
            echo "=== Program headers / interpreter ==="
            readelf -l "$bin"
            echo
            echo "=== Dynamic section ==="
            readelf -d "$bin" || true
            echo
            echo "=== NEEDED ==="
            readelf -d "$bin" 2>/dev/null | grep NEEDED || true
            echo
            echo "=== ABI strings ==="
            strings "$bin" | grep -E 'GLIBC_[0-9]|ld-linux|musl|Android|android|bionic' | head -200 || true
          } | tee portwarp-elf-report.txt

      - name: Classify Android embedding feasibility
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find extracted -type f -name 'pwrp' -print -quit)"
          interp="$(readelf -l "$bin" | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p' | head -1)"
          needed="$(readelf -d "$bin" 2>/dev/null | grep NEEDED || true)"
          glibc="$(strings "$bin" | grep -m1 -E 'GLIBC_[0-9]' || true)"
          etype="$(readelf -h "$bin" | awk -F: '/Type:/{gsub(/^[ \t]+/,"",$2); print $2}')"

          {
            echo "version=${PORTWARP_VERSION}"
            echo "elf_type=$etype"
            echo "interpreter=${interp:-<none>}"
            echo "glibc_marker=${glibc:-<none>}"
            echo "needed_begin"
            printf '%s\n' "$needed"
            echo "needed_end"
          } | tee portwarp-android-classification.txt

          if [[ "$interp" == *"ld-linux"* || -n "$glibc" ]]; then
            echo "RESULT=INCOMPATIBLE_WITH_ANDROID_BIONIC" | tee -a portwarp-android-classification.txt
          elif [[ -z "$interp" && -z "$needed" ]]; then
            echo "RESULT=STATIC_BINARY_REQUIRES_ON_DEVICE_EXEC_TEST" | tee -a portwarp-android-classification.txt
          else
            echo "RESULT=UNKNOWN_REQUIRES_ON_DEVICE_EXEC_TEST" | tee -a portwarp-android-classification.txt
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: portwarp-android-compat-probe
          path: |
            archive-contents.txt
            notices.txt
            portwarp-elf-report.txt
            portwarp-android-classification.txt
          retention-days: 7
