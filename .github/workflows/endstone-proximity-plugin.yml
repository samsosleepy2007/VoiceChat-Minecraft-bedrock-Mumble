name: Endstone Proximity Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/endstone-proximity-v1
      - feature/minecraft-mic-addon-v1
      - feature/vcb-ui-attenuation-level-v1
    paths:
      - "endstone-plugin/**"
      - "tests/test_endstone_plugin_contract.py"
      - "tests/test_endstone_bridge_integration.py"
      - "tests/test_endstone_runtime_api.py"
      - "tests/test_vc_mumble_bridge_contract.py"
      - "docs/VC_MUMBLE_ENDSTONE.md"
      - ".github/workflows/endstone-proximity-plugin.yml"

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile plugin sources
        run: python -m compileall -q endstone-plugin/src

      - name: Run Endstone protocol contracts
        run: |
          python tests/test_endstone_plugin_contract.py
          python tests/test_endstone_bridge_integration.py
          python tests/test_vc_mumble_bridge_contract.py

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf endstone-plugin/dist endstone-plugin/build endstone-plugin/*.egg-info
          python -m build --wheel endstone-plugin

      - name: Install against Endstone 0.11 runtime
        run: |
          python -m pip install "endstone==0.11.11"
          python -m pip install --force-reinstall endstone-plugin/dist/endstone_vc_mumble-0.4.0-py3-none-any.whl
          python tests/test_endstone_runtime_api.py

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("endstone-plugin/dist").glob("endstone_vc_mumble-0.4.0-*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "endstone_vc_mumble/plugin.py" in names
              assert "endstone_vc_mumble/bridge.py" in names
              assert "endstone_vc_mumble/listener.py" in names
              assert "endstone_vc_mumble/model.py" in names
              assert "endstone_vc_mumble/config.toml" in names
          print(f"Verified wheel: {wheel}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: vc-mumble-endstone-plugin-v0.4.0
          path: endstone-plugin/dist/*.whl
          retention-days: 14
