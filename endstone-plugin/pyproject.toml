[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-vc-mumble"
version = "0.4.0"
description = "Authenticated Minecraft Bedrock proximity bridge for VC Mumble Server"
requires-python = ">=3.11"
authors = [{ name = "SamSoSleepy" }]

[project.entry-points."endstone"]
vc-mumble = "endstone_vc_mumble:VCMumblePlugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
endstone_vc_mumble = ["config.toml"]
